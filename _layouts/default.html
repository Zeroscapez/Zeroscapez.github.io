<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description }}">

    <meta property="og:title" content="{{ page.title }} | Agyei Lomini">
    <meta property="og:description" content="{{ page.description | default: site.description }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta property="og:type" content="website">

    <title>{{ page.title }} | Agyei Lomini</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/projects.css">
</head>

<body>
    {% include header.html %}
    <main{% if page.accent %} style="--accent: {{ page.accent }};"{% endif %}>{{ content }}</main>
    {% include footer.html %}

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const sections = document.querySelectorAll(".fade-in");

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("visible");
                    }
                });
            }, { threshold: 0.2 });

            sections.forEach(section => observer.observe(section));

            // Gameplay clips: only download a video once it nears the viewport,
            // and pause it again when scrolled away.
            const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            const videoObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    if (entry.isIntersecting) {
                        if (!video.getAttribute("src")) video.src = video.dataset.src;
                        if (!reduceMotion) video.play().catch(() => {});
                    } else {
                        video.pause();
                    }
                });
            }, { rootMargin: "200px 0px" });

            document.querySelectorAll("video.lazy-video").forEach(video => {
                if (reduceMotion) video.controls = true;
                videoObserver.observe(video);
            });

            // itch.io embeds: the game only loads when the visitor clicks Play. The Unity
            // builds draw at a fixed canvas size, so the iframe renders at native size and
            // is scaled down to the available width.
            const ITCH_CHROME_X = 2;  // embed page's 1px side borders
            const ITCH_CHROME_Y = 21; // 1px top border + 20px itch.io footer bar
            document.querySelectorAll(".itch-embed").forEach(embed => {
                const w = Number(embed.dataset.gameWidth) + ITCH_CHROME_X;
                const h = Number(embed.dataset.gameHeight) + ITCH_CHROME_Y;
                let frame = null;

                const fit = () => {
                    const scale = Math.min(1, embed.clientWidth / w);
                    const border = embed.offsetHeight - embed.clientHeight;
                    embed.style.height = `${h * scale + border}px`;
                    if (frame) frame.style.transform = `scale(${scale})`;
                };
                new ResizeObserver(fit).observe(embed);

                const play = embed.querySelector(".itch-play");
                play.addEventListener("click", event => {
                    event.preventDefault();
                    frame = document.createElement("iframe");
                    frame.src = embed.dataset.src;
                    frame.width = w;
                    frame.height = h;
                    frame.title = play.getAttribute("aria-label");
                    frame.allow = "autoplay; fullscreen *; gamepad";
                    frame.allowFullscreen = true;
                    play.replaceWith(frame);
                    fit();
                    frame.focus();
                });
            });

            const hamburger = document.querySelector(".hamburger");
            const navMenu = document.querySelector(".navbar nav");
            if (hamburger && navMenu) {
                hamburger.addEventListener("click", () => {
                    navMenu.classList.toggle("open");
                    hamburger.classList.toggle("active");
                });
            }
        });
    </script>

</body>

</html>
